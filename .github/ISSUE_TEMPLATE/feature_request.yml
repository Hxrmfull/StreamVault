name: Feature request / Пожелание
description: A new feature, platform or improvement / Новая возможность, площадка или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like / Что хотелось бы
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What for / Зачем
      description: A new feature is made for all four platforms; if one of them can't do it, say so if you know why / Новая возможность делается для всех четырёх площадок; если какая-то так не умеет — напишите, если знаете почему
